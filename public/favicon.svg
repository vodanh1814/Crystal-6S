<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="crystalFacet" x1="20" y1="12" x2="108" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02" />
    </linearGradient>
  </defs>
  <!-- Rounded Squircle Background -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="#0F172A" />
  <rect x="10" y="10" width="108" height="108" rx="24" fill="url(#bgGrad)" />
  <!-- Crystal Hexagon Facet Overlay -->
  <polygon points="64,16 106,38 106,90 64,112 22,90 22,38" fill="url(#crystalFacet)" stroke="#A7F3D0" stroke-opacity="0.45" stroke-width="2" />
  <!-- Bold 5S Typography -->
  <text x="64" y="79" text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif" font-weight="900" font-size="52" fill="#FFFFFF" letter-spacing="-2">5S</text>
  <!-- Top Star Sparkle -->
  <circle cx="96" cy="32" r="4" fill="#FEF08A" />
</svg>
